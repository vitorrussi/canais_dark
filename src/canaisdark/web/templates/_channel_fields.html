{% set c = channel or {} %}
<label>Nome <input name="name" value="{{ c.name or '' }}" required></label>
<label>Descrição <textarea name="description" rows="2">{{ c.description or '' }}</textarea></label>
<div class="grid">
  <label>Link do YouTube <input name="youtube_url" value="{{ c.youtube_url or '' }}"></label>
  <label>Pasta do Drive (ID) <input name="drive_folder_id" value="{{ c.drive_folder_id or '' }}"></label>
</div>
<div class="grid">
  <label>Idioma principal <input name="language" value="{{ c.language or 'pt-BR' }}"></label>
  <label>Idiomas extras (vírgula) <input name="extra_languages" value="{{ (c.extra_languages or [])|join(', ') }}"></label>
  <label>Duração alvo (min) <input type="number" name="target_duration_minutes" min="1" max="240" value="{{ c.target_duration_minutes or 8 }}"></label>
</div>
<label>Voz ElevenLabs (voice_id) <input name="elevenlabs_voice_id" value="{{ c.elevenlabs_voice_id or '' }}"></label>
<label>Prompt de estilo visual (prefixo de todos os prompts de imagem)
  <textarea name="visual_style_prompt" rows="3">{{ c.visual_style_prompt or '' }}</textarea></label>
<label>Template/tom do roteiro <textarea name="script_template" rows="3">{{ c.script_template or '' }}</textarea></label>
