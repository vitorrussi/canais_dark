[project]
name = "canaisdark"
version = "0.9.0"
description = "Estúdio de canais dark do YouTube, operado via MCP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "typer>=0.12",
    "jinja2>=3.1",
    "mcp>=2.3,<3",
    "cryptography>=50.0.2",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=7.1.0",
]

[project.scripts]
canaisdark = "canaisdark.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canaisdark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Padrão: sem os testes que rodam o ffmpeg de verdade (`make test-ffmpeg` roda só eles)
addopts = "-m 'not ffmpeg' --strict-markers"
markers = [
    "ffmpeg: usa o ffmpeg/ffprobe reais (fora da execução padrão)",
    "e2e: fluxo de ponta a ponta com provedores falsos",
    "regression: teste que protege uma correção de bug",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # o formatter cuida do código; strings longas (prompts) são ok

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["canaisdark"]
omit = ["*/migrations/*"]

[tool.coverage.report]
# Piso medido na suíte padrão (sem ffmpeg) menos margem; suba aos poucos, nunca baixe sem motivo.
fail_under = 88
show_missing = false
